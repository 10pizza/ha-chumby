name: Feature request
description: Propose a project feature or integration.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Firmware research
        - Display
        - Audio
        - Touch
        - MQTT
        - Home Assistant
        - Installer
        - Tools
    validations:
      required: true
